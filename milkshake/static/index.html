<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milkshake</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#1a1a1a;--border:#2a2a2a;
  --text:#e0e0e0;--muted:#888;--accent:#7c5cfc;--accent-hover:#9575ff;
  --user-bg:#1e1b2e;--assistant-bg:#1a1a1a;--tool-bg:#1a1025;
  --radius:12px;--font:system-ui,-apple-system,sans-serif
}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100dvh;display:flex}
.sidebar{
  width:260px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:16px;gap:12px;flex-shrink:0;overflow-y:auto
}
.sidebar h1{font-size:1.4rem;font-weight:700;color:var(--accent);letter-spacing:-0.5px}
.sidebar h2{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:8px}
.sidebar label{font-size:0.8rem;color:var(--muted)}
.sidebar select,.sidebar input,.sidebar textarea,.sidebar button{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:8px 10px;font-size:0.85rem;font-family:var(--font)
}
.sidebar textarea{resize:vertical;min-height:60px}
.sidebar button{
  background:var(--accent);border:none;color:#fff;font-weight:600;cursor:pointer
}
.sidebar button:hover{background:var(--accent-hover)}
.sidebar button.danger{background:#3a1a1a}
.sidebar button.danger:hover{background:#5a2a2a}
.mcp-server{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:0.8rem
}
.mcp-server .name{font-weight:600;color:var(--accent)}
.mcp-server .tools{color:var(--muted);margin-top:4px}
.mcp-server .remove{float:right;color:var(--muted);cursor:pointer;font-size:1rem}
.mcp-server .remove:hover{color:#ff5555}
.main{
  flex:1;display:flex;flex-direction:column;min-width:0
}
.messages{
  flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px
}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:0.9rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--user-bg);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--assistant-bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.tool{align-self:flex-start;background:var(--tool-bg);border:1px solid #3a2560;font-size:0.8rem;font-family:monospace;color:var(--muted)}
.msg .role{font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.input-bar{
  padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end
}
.input-bar textarea{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);padding:12px 16px;font-size:0.9rem;font-family:var(--font);resize:none;min-height:48px;max-height:120px
}
.input-bar textarea:focus{outline:none;border-color:var(--accent)}
.input-bar button{
  background:var(--accent);border:none;color:#fff;width:48px;height:48px;border-radius:50%;
  font-size:1.2rem;cursor:pointer;flex-shrink:0
}
.input-bar button:hover{background:var(--accent-hover)}
.typing{color:var(--muted);font-style:italic;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:0.5}}
.empty{text-align:center;color:var(--muted);margin-top:20vh}
.empty h2{font-size:2rem;color:var(--accent);margin-bottom:8px}
.hidden{display:none}
</style>
</head>
<body>
<aside class="sidebar">
  <h1>🥤 Milkshake</h1>
  <label>Model</label>
  <select id="model-select">
    <option value="stealthylm">StealthyLM</option>
    <option value="StealthyLM_Q4KM.gguf">StealthyLM (GGUF)</option>
  </select>
  <label>System prompt</label>
  <textarea id="system-prompt" placeholder="Custom system prompt (optional)..."></textarea>
  <h2>MCP Servers</h2>
  <div style="display:flex;gap:6px">
    <input id="mcp-name" placeholder="Name" style="flex:1">
    <input id="mcp-url" placeholder="http://host:port" style="flex:2">
  </div>
  <button onclick="connectMcp()">+ Add MCP Server</button>
  <div id="mcp-list"></div>
  <div style="flex:1"></div>
  <button onclick="resetChat()" style="background:var(--border);margin-top:8px">Clear chat</button>
  <div style="text-align:center;color:var(--muted);font-size:0.7rem;margin-top:4px">
    powered by Skadoosh
  </div>
</aside>
<main class="main">
  <div class="messages" id="messages">
    <div class="empty" id="welcome">
      <h2>🥤 Milkshake</h2>
      <p>Ask anything. StealthyLM is listening.</p>
    </div>
  </div>
  <div class="input-bar">
    <textarea id="input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button onclick="send()" title="Send (Enter)">↑</button>
  </div>
</main>
<script>
const API = '';
let messages = [];
let streaming = false;

async function fetchModels(){
  try{
    const r = await fetch(API+'/api/models');
    if(!r.ok)return;
    const data = await r.json();
    const sel = document.getElementById('model-select');
    const models = data.models||[];
    sel.innerHTML = models.map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
    if(!models.find(m=>m.name==='stealthylm')){
      sel.innerHTML += '<option value="stealthylm">stealthylm (not pulled)</option>';
    }
  }catch(e){}
}

fetchModels();

document.getElementById('input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});

function addMessage(role,content,cls){
  const div = document.createElement('div');
  div.className = 'msg '+cls;
  if(role) div.innerHTML = `<div class="role">${role}</div>`;
  div.innerHTML += content;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  return div;
}

async function send(){
  if(streaming)return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text)return;
  input.value='';
  input.style.height='auto';

  document.getElementById('welcome')?.classList.add('hidden');

  messages.push({role:'user',content:text});
  addMessage('you',escapeHtml(text),'user');

  const model = document.getElementById('model-select').value;
  const sp = document.getElementById('system-prompt').value.trim();
  const msgDiv = addMessage(model,'<span class="typing">thinking...</span>','assistant');

  streaming = true;
  try{
    const resp = await fetch(API+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages,model,system_prompt:sp||undefined})
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({error:'Unknown error'}));
      msgDiv.innerHTML = `<div class="role">error</div>${escapeHtml(err.error||'Failed')}`;
      streaming=false;return;
    }
    let full = '';
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while(true){
      const {done,value} = await reader.read();
      if(done)break;
      const chunk = dec.decode(value,{stream:true});
      const lines = chunk.split('\n');
      for(const line of lines){
        if(!line.trim())continue;
        try{
          const j = JSON.parse(line);
          if(j.message?.content){
            full += j.message.content;
            msgDiv.innerHTML = `<div class="role">${model}</div>${escapeHtml(full)}`;
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
          }
        }catch(e){}
      }
    }
    if(!full)msgDiv.innerHTML = `<div class="role">${model}</div>(empty response)`;
    messages.push({role:'assistant',content:full||'(empty)'});
  }catch(e){
    msgDiv.innerHTML = `<div class="role">error</div>${escapeHtml(e.message)}`;
  }
  streaming=false;
}

async function connectMcp(){
  const name = document.getElementById('mcp-name').value.trim();
  const url = document.getElementById('mcp-url').value.trim();
  if(!name||!url)return;
  try{
    const r = await fetch(API+'/api/mcp/connect',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,url})
    });
    if(!r.ok){
      const e = await r.json().catch(()=>({error:'Failed'}));
      alert('MCP error: '+(e.error||'Unknown'));
      return;
    }
    document.getElementById('mcp-name').value='';
    document.getElementById('mcp-url').value='';
    refreshMcp();
  }catch(e){alert('MCP error: '+e.message)}
}

async function disconnectMcp(name){
  await fetch(API+'/api/mcp/disconnect',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name})
  });
  refreshMcp();
}

async function refreshMcp(){
  try{
    const r = await fetch(API+'/api/mcp/servers');
    const data = await r.json();
    const list = document.getElementById('mcp-list');
    if(!data.servers?.length){list.innerHTML='<div style="color:var(--muted);font-size:0.8rem;padding:8px">No MCP servers connected</div>';return}
    list.innerHTML = data.servers.map(s=>`
      <div class="mcp-server">
        <span class="remove" onclick="disconnectMcp('${s.name}')" title="Disconnect">×</span>
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="tools">${s.tool_count} tools: ${s.tools.map(t=>'<code>'+escapeHtml(t)+'</code>').join(', ')}</div>
      </div>
    `).join('');
  }catch(e){}
}
refreshMcp();

function resetChat(){
  messages=[];
  document.getElementById('messages').innerHTML = `<div class="empty" id="welcome">
    <h2>🥤 Milkshake</h2><p>Ask anything. StealthyLM is listening.</p></div>`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
