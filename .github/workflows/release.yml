name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: none

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build deps (whisper.cpp bindgen, cpal ALSA)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libasound2-dev
      - name: Tag must match Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$tag" = "$ver" ] || { echo "tag $tag != Cargo.toml version $ver"; exit 1; }
      - name: Dry-run package check
        run: cargo publish --dry-run
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
