name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Disable CPU-specific instructions in whisper.cpp builds.
  # Without this, cached binaries from an AVX-capable runner SIGILL
  # when the cache lands on a runner that lacks those instructions.
  WHISPER_NO_AVX: "ON"
  WHISPER_NO_AVX2: "ON"
  WHISPER_NO_FMA: "ON"
  WHISPER_NO_F16C: "ON"

jobs:
  test:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libasound2-dev pkg-config espeak-ng

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry, target dir, and models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            models
          key: ${{ runner.os }}-skadoosh-v4-${{ hashFiles('Cargo.lock') }}

      - name: Download models and fixtures
        run: timeout 120 ./scripts/download_models.sh || true

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (headless)
        run: cargo test

      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
