[package]
name = "skadoosh"
version = "0.10.0"
edition = "2021"
rust-version = "1.88"
description = "Modular, low-latency local voice agent framework: VAD → Whisper STT → streaming LLM → ONNX TTS with barge-in"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Hot-Coco/Skadoosh"
homepage = "https://github.com/Hot-Coco/Skadoosh"
keywords = ["voice", "stt", "tts", "llm", "audio"]
categories = ["multimedia::audio", "science"]
exclude = ["models/", "tests/data/", ".github/", "scripts/"]

[lib]
name = "skadoosh"
path = "src/lib.rs"

[[bin]]
name = "skadoosh"
path = "src/main.rs"
required-features = ["audio"]

[features]
default = ["download-binaries", "audio"]
## Build-time download of a prebuilt ONNX Runtime (default). Disable default
## features and enable `load-dynamic` to link a system ONNX Runtime at
## runtime instead (what docs.rs uses, since its sandbox has no network).
download-binaries = ["ort/download-binaries", "ort/tls-rustls", "ort/copy-dylibs"]
load-dynamic = ["ort/load-dynamic"]
## Hardware audio I/O and the full voice pipeline: cpal mic capture/playback,
## Silero VAD, whisper-rs STT, and aec-rs echo cancellation. Enabled by
## default. Disable it (`--no-default-features`) for a text-only / docs build
## that pulls in none of the system audio libraries (libasound2-dev,
## libclang-dev): the SDK traits, `Agent` text/REPL/`say_to_wav` paths, and the
## mock engines stay available — only mic capture, playback, VAD, whisper STT,
## echo cancellation, and the pipeline orchestrator are gated out.
audio = ["dep:cpal", "dep:whisper-rs", "dep:aec-rs", "dep:misaki-rs"]
## GPU execution-provider feature flags. Enable exactly one for your platform.
## None enabled by default — ONNX Runtime falls back to CPU.
## * `gpu-cuda` — NVIDIA CUDA (requires CUDA toolkit at build time).
## * `gpu-coreml` — Apple CoreML (macOS only).
## * `gpu-directml` — DirectML on Windows (requires Windows SDK).
## * `gpu-rocm` — AMD ROCm (requires ROCm toolkit at build time).
gpu-cuda = ["ort/cuda"]
gpu-coreml = ["ort/coreml"]
gpu-directml = ["ort/directml"]
gpu-rocm = ["ort/rocm"]

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "api-27"] }
whisper-rs = { version = "=0.15.1", optional = true }
cpal = { version = "=0.18", optional = true }
ringbuf = "=0.4"
reqwest = { version = "=0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "=0.7"
futures-util = "=0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "=2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "=4", features = ["derive", "env"] }
base64 = "=0.22"
aec-rs = { version = "=1", optional = true }
misaki-rs = { version = "0.3", optional = true }
crossterm = "=0.28"
# WASM skill/plugin sandbox (`--plugins-dir`). Default features are disabled to
# keep the dependency footprint small: the plugin system only needs the Cranelift
# compiler, the runtime, and std — no GC, pooling allocator, component model,
# async, or cache. Fuel-gated execution and the ResourceLimiter are ungated.
wasmtime = { version = "30", default-features = false, features = ["cranelift", "runtime", "std"] }

# Unix-only: used by the sandbox to read the inherited RLIMIT hard ceilings
# so the subprocess sandbox never asks `ulimit` to raise a limit above them.
# (`rlimit::Resource` is only exported on unix; gating the dep avoids pulling
# it in on Windows/text-only builds.)
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
notify = "7"

[dev-dependencies]
hound = "=3"
tokio = { version = "1", features = ["full"] }
# WAT parser used by the plugin integration test to synthesize a minimal
# `.wasm` plugin in-memory (no toolchain needed to run the tests).
wat = "1"

# Keep whisper.cpp/ort-heavy dev builds usable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# docs.rs builds in a network-less sandbox, so the ORT binary download would
# fail there; build docs against `load-dynamic` instead (no download, no
# link-time dependency).
[package.metadata.docs.rs]
no-default-features = true
features = ["load-dynamic"]
rustdoc-args = ["--cfg", "docsrs"]

# Cookbook examples — standalone .rs files in cookbooks/ (a non-standard
# directory), so each one needs an explicit [[example]] entry with its path.
[[example]]
name = "01_hello_tts"
path = "cookbooks/01_hello_tts.rs"

[[example]]
name = "02_text_turn"
path = "cookbooks/02_text_turn.rs"

[[example]]
name = "03_repl_mode"
path = "cookbooks/03_repl_mode.rs"

[[example]]
name = "04_multimodal"
path = "cookbooks/04_multimodal.rs"

[[example]]
name = "05_tool_defs"
path = "cookbooks/05_tool_defs.rs"

[[example]]
name = "06_tool_executor"
path = "cookbooks/06_tool_executor.rs"

[[example]]
name = "07_events"
path = "cookbooks/07_events.rs"

[[example]]
name = "08_clause_stream"
path = "cookbooks/08_clause_stream.rs"

[[example]]
name = "09_history"
path = "cookbooks/09_history.rs"

[[example]]
name = "10_config_modes"
path = "cookbooks/10_config_modes.rs"

[[example]]
name = "11_barge_in"
path = "cookbooks/11_barge_in.rs"
required-features = ["audio"]

[[example]]
name = "12_mock_pipeline"
path = "cookbooks/12_mock_pipeline.rs"

[[example]]
name = "13_image_encoding"
path = "cookbooks/13_image_encoding.rs"

[[example]]
name = "14_wake_word"
path = "cookbooks/14_wake_word.rs"

[[example]]
name = "15_push_to_talk"
path = "cookbooks/15_push_to_talk.rs"

# Auto-discovered from `examples/`; the full voice pipeline (mic/VAD/STT/
# playback) needs the `audio` feature's system libraries, so they are skipped
# in a no-`audio` (text-only / docs) build.
[[example]]
name = "chatbot"

[[example]]
name = "mock_agent"
required-features = ["audio"]

[[example]]
name = "voice_agent"
required-features = ["audio"]

# Text-only RAG demo: loads .txt/.md docs, indexes them with `rag::RagStore`,
# and answers one query by retrieving and injecting the top-k chunks. Needs no
# `audio` feature (it does link the ONNX embedder via `ort`, like any RAG use).
[[example]]
name = "docbot"
