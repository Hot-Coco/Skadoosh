[package]
name = "skadoosh"
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
description = "Modular, low-latency local voice agent framework: VAD → Whisper STT → streaming LLM → ONNX TTS with barge-in"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Hot-Coco/Skadoosh"
homepage = "https://github.com/Hot-Coco/Skadoosh"
keywords = ["voice", "stt", "tts", "llm", "audio"]
categories = ["multimedia::audio", "science"]
exclude = ["models/", "tests/data/", ".github/", "scripts/"]

[lib]
name = "skadoosh"
path = "src/lib.rs"

[[bin]]
name = "skadoosh"
path = "src/main.rs"

[features]
default = ["download-binaries"]
## Build-time download of a prebuilt ONNX Runtime (default). Disable default
## features and enable `load-dynamic` to link a system ONNX Runtime at
## runtime instead (what docs.rs uses, since its sandbox has no network).
download-binaries = ["ort/download-binaries", "ort/tls-rustls", "ort/copy-dylibs"]
load-dynamic = ["ort/load-dynamic"]
## GPU execution-provider feature flags. Enable exactly one for your platform.
## None enabled by default — ONNX Runtime falls back to CPU.
## * `gpu-cuda` — NVIDIA CUDA (requires CUDA toolkit at build time).
## * `gpu-coreml` — Apple CoreML (macOS only).
## * `gpu-directml` — DirectML on Windows (requires Windows SDK).
## * `gpu-rocm` — AMD ROCm (requires ROCm toolkit at build time).
gpu-cuda = ["ort/cuda"]
gpu-coreml = ["ort/coreml"]
gpu-directml = ["ort/directml"]
gpu-rocm = ["ort/rocm"]

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "api-27"] }
whisper-rs = "=0.15.1"
cpal = "=0.18"
ringbuf = "=0.4"
reqwest = { version = "=0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "=0.7"
futures-util = "=0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "=2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "=4", features = ["derive", "env"] }
base64 = "=0.22"
aec-rs = "=1"
misaki-rs = "0.3"
crossterm = "=0.28"

[dev-dependencies]
hound = "=3"
tokio = { version = "1", features = ["full"] }

# Keep whisper.cpp/ort-heavy dev builds usable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# docs.rs builds in a network-less sandbox, so the ORT binary download would
# fail there; build docs against `load-dynamic` instead (no download, no
# link-time dependency).
[package.metadata.docs.rs]
no-default-features = true
features = ["load-dynamic"]
rustdoc-args = ["--cfg", "docsrs"]

# Cookbook examples — standalone .rs files in cookbooks/ (a non-standard
# directory), so each one needs an explicit [[example]] entry with its path.
[[example]]
name = "01_hello_tts"
path = "cookbooks/01_hello_tts.rs"

[[example]]
name = "02_text_turn"
path = "cookbooks/02_text_turn.rs"

[[example]]
name = "03_repl_mode"
path = "cookbooks/03_repl_mode.rs"

[[example]]
name = "04_multimodal"
path = "cookbooks/04_multimodal.rs"

[[example]]
